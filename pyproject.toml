[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qe-helper"
version = "0.1.0"
description = "Lightweight LangGraph workflows for common Quality Engineering artifacts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2,<1",
  "litellm>=1.63,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]
dev = ["pytest>=8,<9", "pyinstaller>=6,<7"]

[project.scripts]
qe-helper = "qehelper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qehelper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
